name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make fmt-check
      - run: make lint
      - run: make test
      - run: go test -race ./...
      - name: Native terminal isolation and PTY lifecycle
        env:
          RUN_TERMINAL_SANDBOX_TESTS: "1"
        run: go test -count=1 ./internal/terminalclient

  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: access_gateway
          POSTGRES_USER: access_gateway
          POSTGRES_PASSWORD: access_gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U access_gateway -d access_gateway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_TEST_DSN: postgres://access_gateway:access_gateway@127.0.0.1:5432/access_gateway?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make test-integration
      - run: go test -race -count=1 -tags=integration ./internal/repository ./tests/integration

  manifests:
    name: Kustomize and schema validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.8"
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.34.1
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
      - name: Render base
        run: kubectl kustomize deploy/kubernetes > /tmp/base.yaml
      - name: Validate base
        run: kubeconform -strict -summary -ignore-missing-schemas /tmp/base.yaml
      - name: Render deployable production overlay
        env:
          ACCESS_GATEWAY_IMAGE_DIGEST: sha256:1111111111111111111111111111111111111111111111111111111111111111
          BUSYBOX_IMAGE_DIGEST: sha256:5555555555555555555555555555555555555555555555555555555555555555
          PUBLIC_URL: https://access-gateway.ci.example.com
          INGRESS_TLS_SECRET: access-gateway-ingress-tls
          INGRESS_NAMESPACE: ingress-nginx
          MONITORING_NAMESPACE: monitoring
          POSTGRES_CIDR: 10.20.30.40/32
          POSTGRES_PORT: "5432"
          TARGET_CIDR: 10.10.0.0/16
          ACCESS_SOURCE_CIDR: 10.40.0.0/16
          KUBERNETES_API_CIDR: 10.96.0.1/32
          KUBERNETES_API_PORT: "443"
          EXTERNAL_HTTPS_CIDR: 10.30.0.0/16
          SESSION_AGENT_NODE_NAME: worker-ci
          ASSET_KEY_VERSION: asset-key-ci
          ADMIN_USER_IDS: ou_ci_admin
        run: scripts/render-production-manifests.sh > /tmp/production.yaml
      - name: Validate production
        run: kubeconform -strict -summary -ignore-missing-schemas /tmp/production.yaml

  vulnerabilities:
    name: Go vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...

  images:
    name: Build and scan access-gateway
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: access-gateway
          load: true
          tags: kuzane/access-gateway:sha-${{ github.sha }}
          cache-from: type=gha,scope=access-gateway
          cache-to: type=gha,mode=max,scope=access-gateway
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Compile native terminal container checks
        run: CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/terminalclient.test" ./internal/terminalclient
      - name: Verify terminal isolation in the runtime image
        run: |
          docker run --rm --network none --read-only --user 65532:65532 \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 128 --memory 512m --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,size=33554432,mode=1777 \
            --mount "type=bind,source=$RUNNER_TEMP/terminalclient.test,target=/terminalclient.test,readonly" \
            -e RUN_TERMINAL_SANDBOX_TESTS=1 --entrypoint /terminalclient.test \
            "kuzane/access-gateway:sha-${{ github.sha }}" -test.v -test.timeout=60s
      - uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          image-ref: kuzane/access-gateway:sha-${{ github.sha }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"

  sbom:
    name: Source SBOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: access-gateway-source.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-sbom
          path: access-gateway-source.spdx.json
