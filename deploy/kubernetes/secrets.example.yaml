# Documentation only. Do not apply this file or commit real values. In
# production, materialize these keys with the cluster Secret Manager/CSI/GitOps
# integration and pin every workload image by digest.
apiVersion: v1
kind: Secret
metadata:
  name: access-gateway-secrets
  namespace: access-gateway
type: Opaque
stringData:
  database-url: replace-with-postgresql-tls-dsn
  encryption-key: replace-with-at-least-32-random-bytes
  gateway-internal-secret: replace-with-shared-at-least-32-random-bytes
  audit-collector-secret: replace-with-distinct-at-least-32-random-bytes
  metrics-bearer-token: replace-with-at-least-32-random-bytes
  asset-encryption-key: replace-with-32-random-bytes-or-base64
  cmdb-bearer-token: replace-with-at-least-32-random-bytes
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-audit-secrets
  namespace: access-gateway
type: Opaque
stringData:
  # The key must equal the Gateway auth_secret_ref. During rotation the value
  # may contain the new and previous credentials on separate lines.
  gateway-primary: replace-with-gateway-specific-at-least-32-random-bytes
---
apiVersion: v1
kind: Secret
metadata:
  name: access-gateway-client-tls
  namespace: access-gateway
type: Opaque
stringData:
  tls.crt: replace-with-control-plane-client-certificate-pem
  tls.key: replace-with-control-plane-client-private-key-pem
  ca.crt: replace-with-gateway-server-root-ca-pem
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-agent-secrets
  namespace: access-gateway
type: Opaque
stringData:
  internal-secret: replace-with-shared-at-least-32-random-bytes
  audit-secret: replace-with-gateway-specific-at-least-32-random-bytes
  metrics-bearer-token: replace-with-at-least-32-random-bytes
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-agent-tls
  namespace: access-gateway
type: Opaque
stringData:
  tls.crt: replace-with-gateway-server-certificate-pem
  tls.key: replace-with-gateway-server-private-key-pem
  ca.crt: replace-with-control-plane-client-ca-pem
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-agent-targets
  namespace: access-gateway
type: Opaque
stringData:
  targets.json: |
    {
      "version": 1,
      "targets": [
        {
          "target_id": "22222222-2222-4222-8222-222222222222",
          "host": "10.10.1.20",
          "ports": [5432]
        }
      ]
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-agent-monitor-tls
  namespace: access-gateway
type: kubernetes.io/tls
stringData:
  tls.crt: replace-with-prometheus-client-certificate-pem
  tls.key: replace-with-prometheus-client-private-key-pem
  ca.crt: replace-with-gateway-server-root-ca-pem
