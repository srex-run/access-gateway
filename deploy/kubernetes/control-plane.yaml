apiVersion: v1
kind: ConfigMap
metadata:
  name: access-gateway-config
data:
  HTTP_ADDR: ":8080"
  DATABASE_URL_FILE: "/run/access-gateway/secrets/database-url"
  ENCRYPTION_KEY_FILE: "/run/access-gateway/secrets/encryption-key"
  GATEWAY_RUNTIME: "kubernetes"
  SESSION_AGENT_NAMESPACE: "access-gateway"
  SESSION_AGENT_IMAGE: "kuzane/access-gateway:v0.1.0"
  SESSION_AGENT_NODE_NAME: "REPLACE_SESSION_NODE_NAME"
  PUBLIC_URL: "https://access-gateway.example.invalid"
  SESSION_AGENT_CONTROL_PLANE_URL: "https://access-gateway.example.invalid"
  SESSION_AGENT_STARTUP_TIMEOUT: "90s"
  SESSION_AGENT_MAX_SESSIONS: "100"
  AUDIT_COLLECTOR_SECRET_FILE: "/run/access-gateway/secrets/audit-collector-secret"
  METRICS_BEARER_TOKEN_FILE: "/run/access-gateway/secrets/metrics-bearer-token"
  ASSET_ENCRYPTION_KEY_FILE: "/run/access-gateway/secrets/asset-encryption-key"
  ASSET_ENCRYPTION_KEY_ID: "replace-with-managed-key-version"
  ALLOW_DEV_AUTH: "false"
  DEMO_MODE: "false"
  ADMIN_USER_IDS: ""
  GATEWAY_HEALTH_INTERVAL: "10s"
  GATEWAY_HEARTBEAT_MAX_AGE: "30s"
  GATEWAY_HEALTH_FAILURE_THRESHOLD: "3"
  METRICS_ENABLED: "true"
  OTEL_SERVICE_NAME: "access-gateway"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: access-gateway-migrate
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: access-gateway-migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-database-secret
          image: busybox:1.36.1
          command:
            - sh
            - -ec
            - |
              mkdir -p /runtime/secrets
              chmod 0700 /runtime/secrets
              cp /source/secrets/database-url /runtime/secrets/database-url
              chmod 0400 /runtime/secrets/database-url
              test -s /runtime/secrets/database-url
          volumeMounts:
            - name: source-secrets
              mountPath: /source/secrets
              readOnly: true
            - name: runtime
              mountPath: /runtime
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      containers:
        - name: migrate
          image: kuzane/access-gateway:v0.1.0
          command: ["/usr/local/bin/migrate", "up"]
          envFrom:
            - configMapRef:
                name: access-gateway-config
          volumeMounts:
            - name: runtime
              mountPath: /run/access-gateway
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      volumes:
        - name: source-secrets
          secret:
            secretName: access-gateway-secrets
            defaultMode: 0444
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-gateway
  labels:
    app.kubernetes.io/name: access-gateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: access-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: access-gateway
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      serviceAccountName: access-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: access-gateway
      initContainers:
        - name: prepare-secrets
          image: busybox:1.36.1
          command:
            - sh
            - -ec
            - |
              mkdir -p /runtime/secrets
              chmod 0700 /runtime/secrets
              for name in database-url encryption-key audit-collector-secret metrics-bearer-token asset-encryption-key cmdb-bearer-token; do
                cp "/source/secrets/${name}" "/runtime/secrets/${name}"
                chmod 0400 "/runtime/secrets/${name}"
                test -s "/runtime/secrets/${name}"
              done
          volumeMounts:
            - name: source-secrets
              mountPath: /source/secrets
              readOnly: true
            - name: runtime
              mountPath: /runtime
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      containers:
        - name: access-gateway
          image: kuzane/access-gateway:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: access-gateway-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: runtime
              mountPath: /run/access-gateway
              readOnly: true
            - name: kubernetes-api
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      volumes:
        - name: source-secrets
          secret:
            secretName: access-gateway-secrets
            defaultMode: 0444
        - name: kubernetes-api
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 2Mi
---
apiVersion: v1
kind: Service
metadata:
  name: access-gateway
  labels:
    app.kubernetes.io/name: access-gateway
spec:
  selector:
    app.kubernetes.io/name: access-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: access-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: access-gateway
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: access-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: access-gateway
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
