# Requires External Secrets Operator and a reviewed ClusterSecretStore named
# enterprise-secret-store. Remote keys are contracts, not example values.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: access-gateway-secrets
  namespace: access-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: enterprise-secret-store
  target:
    name: access-gateway-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef: {key: /access-gateway/production/control-plane, property: database-url}
    - secretKey: encryption-key
      remoteRef: {key: /access-gateway/production/control-plane, property: encryption-key}
    - secretKey: gateway-internal-secret
      remoteRef: {key: /access-gateway/production/control-plane, property: gateway-internal-secret}
    - secretKey: audit-collector-secret
      remoteRef: {key: /access-gateway/production/control-plane, property: audit-collector-secret}
    - secretKey: metrics-bearer-token
      remoteRef: {key: /access-gateway/production/control-plane, property: metrics-bearer-token}
    - secretKey: asset-encryption-key
      remoteRef: {key: /access-gateway/production/control-plane, property: asset-encryption-key}
    - secretKey: cmdb-bearer-token
      remoteRef: {key: /access-gateway/production/control-plane, property: cmdb-bearer-token}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gateway-audit-secrets
  namespace: access-gateway
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: enterprise-secret-store}
  target: {name: gateway-audit-secrets, creationPolicy: Owner}
  data:
    - secretKey: gateway-primary
      remoteRef: {key: /access-gateway/production/gateways/gateway-primary, property: accepted-audit-secrets}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: access-gateway-client-tls
  namespace: access-gateway
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: enterprise-secret-store}
  target: {name: access-gateway-client-tls, creationPolicy: Owner, template: {type: kubernetes.io/tls}}
  data:
    - secretKey: tls.crt
      remoteRef: {key: /access-gateway/production/control-plane-mtls, property: tls.crt}
    - secretKey: tls.key
      remoteRef: {key: /access-gateway/production/control-plane-mtls, property: tls.key}
    - secretKey: ca.crt
      remoteRef: {key: /access-gateway/production/control-plane-mtls, property: ca.crt}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gateway-agent-secrets
  namespace: access-gateway
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: enterprise-secret-store}
  target: {name: gateway-agent-secrets, creationPolicy: Owner}
  data:
    - secretKey: internal-secret
      remoteRef: {key: /access-gateway/production/gateway-agent, property: internal-secret}
    - secretKey: audit-secret
      remoteRef: {key: /access-gateway/production/gateways/gateway-primary, property: audit-secret}
    - secretKey: metrics-bearer-token
      remoteRef: {key: /access-gateway/production/gateway-agent, property: metrics-bearer-token}
---
