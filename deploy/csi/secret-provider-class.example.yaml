# Provider-specific example for the HashiCorp Vault Secrets Store CSI provider.
# Review object paths, identities, rotation interval, and fail-closed behavior in
# the target cluster before replacing Kubernetes Secret volumes.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: access-gateway-vault
  namespace: access-gateway
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.example.internal:8200"
    roleName: "access-gateway-production"
    objects: |
      - objectName: "database-url"
        secretPath: "access-gateway/data/production/control-plane"
        secretKey: "database-url"
      - objectName: "encryption-key"
        secretPath: "access-gateway/data/production/control-plane"
        secretKey: "encryption-key"
      - objectName: "audit-collector-secret"
        secretPath: "access-gateway/data/production/control-plane"
        secretKey: "audit-collector-secret"
      - objectName: "gateway-primary-audit-bundle"
        secretPath: "access-gateway/data/production/gateways/gateway-primary"
        secretKey: "accepted-audit-secrets"
  secretObjects:
    - secretName: access-gateway-secrets
      type: Opaque
      data:
        - objectName: database-url
          key: database-url
        - objectName: encryption-key
          key: encryption-key
        - objectName: audit-collector-secret
          key: audit-collector-secret
    - secretName: gateway-audit-secrets
      type: Opaque
      data:
        - objectName: gateway-primary-audit-bundle
          key: gateway-primary
