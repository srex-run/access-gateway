# Include from nginx.conf's http block, for example via /etc/nginx/conf.d/.
# Replace the domain and install the certificate and key before nginx -t.
# Nginx runs on the same Linux host as the production Compose application.
map $http_upgrade $access_gateway_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name access-gateway.srex.run;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name access-gateway.srex.run;

    ssl_certificate /etc/nginx/tls/cf-client-cert.crt;
    ssl_certificate_key /etc/nginx/tls/cf-client-key.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $access_gateway_connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }
}
